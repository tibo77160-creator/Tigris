{
  "name": "Compiler Tigris",
  "on": { "workflow_dispatch": {} },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        { "uses": "actions/checkout@v4" },
        { "uses": "actions/setup-java@v4", "with": { "distribution": "temurin", "java-version": "21" } },
        {
          "name": "Cle de signature (secret TIGRIS_KEYSTORE_B64, sinon cle temporaire)",
          "env": { "KS": "${{ secrets.TIGRIS_KEYSTORE_B64 }}" },
          "run": "mkdir -p ~/.android; if [ -n \"$KS\" ]; then echo \"$KS\" | base64 -d > ~/.android/debug.keystore; echo 'Cle fixe utilisee'; else echo 'Pas de secret : cle temporaire (une mise a jour demandera de desinstaller)'; fi"
        },
        {
          "name": "Compiler",
          "run": "chmod +x gradlew && ./gradlew assembleStandardRelease --no-daemon --console=plain --stacktrace"
        },
        {
          "name": "Verifier",
          "working-directory": "app/build/outputs/apk/standard/release",
          "run": "BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1); $BT/aapt2 dump badging *.apk | head -3; $BT/apksigner verify --print-certs *.apk | head -4; sha256sum *.apk; ls -la"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": { "name": "tigris-apk", "path": "app/build/outputs/apk/standard/release/*.apk" }
        }
      ]
    }
  }
}
